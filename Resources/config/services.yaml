parameters:
    sympress_nginx_cache.default_path: '/var/cache/nginx/wordpress'
    sympress_nginx_cache.status_scan_limit: 5000

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    _instanceof:
        SymPress\NginxCache\Cli\Command\WpCliCommand:
            tags:
                - { name: sympress_nginx_cache.wp_cli_command }
                - { name: console.command }

    Symfony\Component\Filesystem\Filesystem: ~

    Symfony\Component\Clock\ClockInterface:
        factory: ['Symfony\Component\Clock\Clock', 'get']

    Symfony\Contracts\HttpClient\HttpClientInterface:
        factory: ['Symfony\Component\HttpClient\HttpClient', 'create']

    Symfony\Component\Lock\PersistingStoreInterface:
        alias: SymPress\NginxCache\Support\WordPressOptionLockStore

    Symfony\Component\Lock\LockFactory: ~

    SymPress\NginxCache\:
        resource: '../../src/'
        exclude:
            - '../../src/NginxCacheBundle.php'
            - '../../src/Exception/'
            - '../../src/Event/'
            - '../../src/Value/'
            - '../../src/Admin/NetworkSitesTable.php'

    SymPress\NginxCache\Settings\WordPressCacheSettings:
        arguments:
            $defaultPath: '%sympress_nginx_cache.default_path%'

    SymPress\NginxCache\Security\Capabilities:
        tags:
            - { name: kernel.hook, hook: 'map_meta_cap', method: map, type: filter, accepted_args: 4 }

    SymPress\NginxCache\Settings\OptionSource:
        tags:
            - { name: kernel.hook, hook: 'pre_update_option', method: protectUpdate, type: filter, accepted_args: 3 }

    SymPress\NginxCache\Purge\RedisPageCacheStore:
        alias: SymPress\NginxCache\Purge\PredisPageCacheStore

    SymPress\NginxCache\Purge\SiteScopeResolver:
        tags:
            - { name: kernel.hook, hook: 'wp_initialize_site', method: reset }
            - { name: kernel.hook, hook: 'wp_update_site', method: reset }
            - { name: kernel.hook, hook: 'wp_delete_site', method: reset }

    SymPress\NginxCache\Settings\CompatibilitySettings:
        tags:
            - { name: kernel.hook, hook: 'admin_init', method: register }

    SymPress\NginxCache\Migration\LegacyHookBridge:
        tags:
            - { name: kernel.hook, hook: 'init', method: register, priority: 10 }
            - { name: kernel.hook, hook: 'sympress_nginx_cache_purge_urls', method: additionalUrls, type: filter }

    SymPress\NginxCache\Admin\MigrationNotice:
        tags:
            - { name: kernel.hook, hook: 'admin_notices', method: notice }
            - { name: kernel.hook, hook: 'admin_post_sympress_nginx_cache_migrate', method: handle }

    SymPress\NginxCache\Admin\EditorActions:
        tags:
            - { name: kernel.hook, hook: 'admin_bar_menu', method: adminBar, accepted_args: 1, priority: 110 }
            - { name: kernel.hook, hook: 'post_row_actions', method: postActions, type: filter, accepted_args: 2 }
            - { name: kernel.hook, hook: 'page_row_actions', method: postActions, type: filter, accepted_args: 2 }
            - { name: kernel.hook, hook: 'tag_row_actions', method: termActions, type: filter, accepted_args: 2 }
            - { name: kernel.hook, hook: 'bulk_actions-edit-post', method: bulkActions, type: filter }
            - { name: kernel.hook, hook: 'bulk_actions-edit-page', method: bulkActions, type: filter }
            - { name: kernel.hook, hook: 'handle_bulk_actions-edit-post', method: bulk, type: filter, accepted_args: 3 }
            - { name: kernel.hook, hook: 'handle_bulk_actions-edit-page', method: bulk, type: filter, accepted_args: 3 }
            - { name: kernel.hook, hook: 'admin_post_sympress_nginx_cache_purge_object', method: handle }
            - { name: kernel.hook, hook: 'admin_notices', method: notice }

    SymPress\NginxCache\Config\MultisiteMapGenerator:
        tags:
            - { name: kernel.hook, hook: 'wp_initialize_site', method: refresh }
            - { name: kernel.hook, hook: 'wp_update_site', method: refresh }
            - { name: kernel.hook, hook: 'wp_delete_site', method: refresh }
            - { name: kernel.hook, hook: 'admin_init', method: refresh }

    SymPress\NginxCache\Hook\HtmlCacheStampSubscriber:
        tags:
            - { name: kernel.hook, hook: 'shutdown', method: render, priority: 999999 }

    SymPress\NginxCache\Inspection\CacheStatusInspector:
        arguments:
            $scanLimit: '%sympress_nginx_cache.status_scan_limit%'

    SymPress\NginxCache\Inspection\SiteHealth:
        tags:
            - { name: kernel.hook, hook: 'site_status_tests', method: tests, type: filter }
            - { name: kernel.hook, hook: 'debug_information', method: debug, type: filter }

    SymPress\NginxCache\Admin\SettingsPage:
        tags:
            - { name: kernel.hook, hook: 'admin_init', method: registerSettings }
            - { name: kernel.hook, hook: 'admin_menu', method: registerMenu }
            - { name: kernel.hook, hook: 'admin_notices', method: renderAdminNotice }
            - { name: kernel.hook, hook: 'admin_post_sympress_nginx_cache_purge', method: handlePurgeAction }
            - { name: kernel.hook, hook: 'admin_post_sympress_nginx_cache_flush_queue', method: handleQueueAction }
            - { name: kernel.hook, hook: 'admin_bar_menu', method: addAdminBarNode, accepted_args: 1, priority: 100 }
            - { name: kernel.hook, hook: 'plugin_action_links_nginx-cache/nginx-cache.php', method: addPluginActionLinks, type: filter, accepted_args: 1 }

    SymPress\NginxCache\Admin\NetworkAdminPage:
        tags:
            - { name: kernel.hook, hook: 'network_admin_menu', method: menu }
            - { name: kernel.hook, hook: 'network_admin_edit_sympress_nginx_cache_network', method: handle }

    SymPress\NginxCache\Admin\PermissionFields:
        tags:
            - { name: kernel.hook, hook: 'admin_init', method: register }
            - { name: kernel.hook, hook: 'admin_footer', method: managedFields }

    SymPress\NginxCache\Surrogate\TagIndexRepository:
        tags:
            - { name: kernel.hook, hook: 'init', method: install, priority: 5 }

    SymPress\NginxCache\Hook\AutomaticPurgeSubscriber:
        tags:
            - { name: kernel.hook, hook: 'init', method: register, priority: 20 }
            - { name: kernel.hook, hook: 'shutdown', method: flushPending, priority: 899000 }

    SymPress\NginxCache\Hook\SurrogateTagSubscriber:
        tags:
            - { name: kernel.hook, hook: 'send_headers', method: sendHeaders }
            - { name: kernel.hook, hook: 'shutdown', method: remember, priority: 900000 }

    SymPress\NginxCache\Hook\RestGraphQlCacheTagSubscriber:
        tags:
            - { name: kernel.hook, hook: 'rest_api_init', method: registerRestFilters }
            - { name: kernel.hook, hook: 'rest_pre_dispatch', method: resetRestTags, type: filter, accepted_args: 3 }
            - { name: kernel.hook, hook: 'rest_post_dispatch', method: addRestHeaders, type: filter, accepted_args: 3 }
            - { name: kernel.hook, hook: 'graphql_dataloader_get_model', method: collectGraphQlModel, type: filter, accepted_args: 1 }
            - { name: kernel.hook, hook: 'graphql_response_headers_to_send', method: addGraphQlHeaders, type: filter, accepted_args: 1 }

    SymPress\NginxCache\Hook\HeartbeatControlSubscriber:
        tags:
            - { name: kernel.hook, hook: 'heartbeat_settings', method: configure, type: filter, accepted_args: 1 }
            - { name: kernel.hook, hook: 'wp_enqueue_scripts', method: maybeDisable, priority: 100 }
            - { name: kernel.hook, hook: 'admin_enqueue_scripts', method: maybeDisable, priority: 100 }

    SymPress\NginxCache\Purge\PurgeQueueProcessor:
        tags:
            - { name: kernel.hook, hook: 'sympress_nginx_cache_process_queue', method: process }

    SymPress\NginxCache\Purge\PurgeSideEffectProcessor:
        tags:
            - { name: kernel.hook, hook: 'sympress_nginx_cache_process_side_effects', method: process }

    SymPress\NginxCache\Rest\CacheRestController:
        tags:
            - { name: kernel.hook, hook: 'rest_api_init', method: register }

    SymPress\NginxCache\Cli\CacheCommand:
        arguments:
            $commands: !tagged_iterator sympress_nginx_cache.wp_cli_command
        tags:
            - { name: kernel.hook, hook: 'cli_init', method: register }
